# szymtrener.pl — nginx przed aplikacja Spring Boot (127.0.0.1:8080).
#
# Dwie rzeczy, ktore latwo zepsuc:
#  1. X-Forwarded-Proto — bez niego canonical i JSON-LD wyjda z http://,
#     bo aplikacja ma server.forward-headers-strategy=native.
#  2. JEDNO przekierowanie, nigdy lancuch. http://www -> https://szymtrener.pl
#     musi byc pojedynczym skokiem 301; kazdy skok wiecej to -15 pkt w audycie.

server {
    listen 80;
    listen [::]:80;
    server_name szymtrener.pl www.szymtrener.pl;

    # certbot musi dosiegnac tego katalogu takze przed wystawieniem certyfikatu
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://szymtrener.pl$request_uri; }   # od razu na docelowy host
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.szymtrener.pl;

    ssl_certificate     /etc/letsencrypt/live/szymtrener.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szymtrener.pl/privkey.pem;

    return 301 https://szymtrener.pl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name szymtrener.pl;

    ssl_certificate     /etc/letsencrypt/live/szymtrener.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szymtrener.pl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 30m;          # zgodnie ze spring.servlet.multipart.max-request-size

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/xml;

    # Zasoby statyczne serwuje nginx, aplikacja ich nie oglada.
    location ~* ^/(css|js|images)/ {
        root /opt/szymtrener/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Pliki z bazy (/media/..., /pliki/...) ida przez aplikacje, ale klucze sa
    # niezmienne — wiec cache'ujemy odpowiedz u siebie i nie meczymy Postgresa.
    location ~* ^/(media|pliki)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_valid 200 30d;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
