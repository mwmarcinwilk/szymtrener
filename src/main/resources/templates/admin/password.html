<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head(${title})}"></head>
<body>
<div th:replace="~{fragments/admin-icons :: icons}"></div>
<div class="app">
  <div th:replace="~{fragments/admin-layout :: sidebar('settings')}"></div>
  <div class="main">
    <div th:replace="~{fragments/admin-layout :: topbar(${title})}"></div>
    <div class="content">

      <div class="card" style="padding:22px;max-width:520px">
        <div class="card-h" style="padding:0 0 14px"><h2>Zmiana hasła</h2></div>

        <div th:if="${error}" role="alert"
             style="background:var(--red-pale);color:var(--red);border-radius:10px;padding:11px 13px;font-size:13px;font-weight:700;margin-bottom:16px"
             th:text="${error}">Błąd</div>

        <form method="post" th:action="@{/admin/haslo}" th:object="${form}" autocomplete="off">
          <div class="fld">
            <label for="current">Obecne hasło</label>
            <input type="password" id="current" th:field="*{current}" required autocomplete="current-password">
          </div>
          <div class="fld">
            <label for="fresh">Nowe hasło</label>
            <input type="password" id="fresh" th:field="*{fresh}" required
                   th:minlength="${minLength}" autocomplete="new-password">
            <small style="color:var(--ink-3);font-size:11.5px"
                   th:text="|Minimum ${minLength} znaków. Najlepiej cała fraza, nie jedno słowo.|">Minimum 12 znaków.</small>
          </div>
          <div class="fld">
            <label for="repeat">Powtórz nowe hasło</label>
            <input type="password" id="repeat" th:field="*{repeat}" required
                   th:minlength="${minLength}" autocomplete="new-password">
          </div>
          <button class="btn btn-p" type="submit">Zmień hasło</button>
        </form>

        <p style="color:var(--ink-3);font-size:12px;margin-top:18px;line-height:1.6">
          Po zmianie zostaniesz wylogowany i zalogujesz się nowym hasłem.
          Wtedy możesz usunąć <code>ADMIN_PASSWORD</code> z pliku <code>.env</code> na serwerze.
          Jest potrzebne tylko przy pierwszym uruchomieniu.
        </p>
      </div>

    </div>
  </div>
</div>
<script th:src="@{/js/admin.js}" src="/js/admin.js" defer></script>
</body>
</html>
