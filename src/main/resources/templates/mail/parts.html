<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<!--/* Wspolne kawalki formatek do klienta. Style w atrybutach i uklad na tabelach,

  <tr th:fragment="contact"><td style="padding:0 24px 24px">

      Trener personalny, Trener Longevity<br>
      Armii Krajowej 32a, 94-046 Łódź<br>
      <a href="tel:+48502338373" style="color:#1D9E75;text-decoration:none">502 338 373</a> ·
      <a th:href="${siteUrl}" th:text="${siteHost}" style="color:#1D9E75;text-decoration:none">szymtrener.pl</a>
    </div>
  </td></tr>

</table>
</body>
</html>
